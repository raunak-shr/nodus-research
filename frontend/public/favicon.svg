<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The Nodus mark, the same geometry src/components/Mark.tsx draws in the
       header and the sidebar: two nodes and the edge between them, knocked out
       of the accent square. Fixed colours rather than tokens — a favicon is
       rendered by the browser chrome, which has no stylesheet and no theme. -->
  <title>Nodus</title>
  <rect width="32" height="32" fill="#ec3013" />
  <g fill="#f3f2f2">
    <rect x="6" y="6" width="7" height="7" />
    <rect x="19" y="19" width="7" height="7" />
    <rect x="9.5" y="9.5" width="18" height="2" transform="rotate(45 9.5 10.5)" />
  </g>
</svg>
