services:
  ollama:
    image: ollama/ollama:latest
    container_name: nodus-ollama
    ports:
      - "11434:11434"
    volumes:
      - nodus_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nodus_ollama:
